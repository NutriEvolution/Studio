name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npx --yes @tauri-apps/cli@2 icon app-icon.png
      - run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npx --yes @tauri-apps/cli@2 icon app-icon.png
      - run: npm install
      - name: NDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          bash ci/run.sh ndk bash -c "echo HOME=$ANDROID_HOME; ls $ANDROID_HOME; ls $ANDROID_HOME/cmdline-tools; yes | $SDKM --licenses > /dev/null; $SDKM --install 'ndk;27.0.12077973' 'platforms;android-34' 'build-tools;34.0.0'"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: bash ci/run.sh android-init npx --yes @tauri-apps/cli@2 android init
      - run: bash ci/run.sh android-build npx --yes @tauri-apps/cli@2 android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: studio-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [windows, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.exe
            out/**/*.msi
            out/**/*.apk
