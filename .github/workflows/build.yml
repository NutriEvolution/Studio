name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npx --yes @tauri-apps/cli@2 icon app-icon.png
      - run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npx --yes @tauri-apps/cli@2 icon app-icon.png
      - run: npm install
      - name: NDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          bash ci/run.sh ndk bash -c "echo HOME=$ANDROID_HOME; ls $ANDROID_HOME; ls $ANDROID_HOME/cmdline-tools; yes | $SDKM --licenses > /dev/null; $SDKM --install 'ndk;27.0.12077973' 'platforms;android-34' 'build-tools;34.0.0'"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: bash ci/run.sh android-init npx --yes @tauri-apps/cli@2 android init
      - name: Margini di sistema (barra di stato e navigazione)
        run: |
          F=$(find src-tauri/gen/android -name MainActivity.kt | head -1)
          echo "MainActivity: $F"
          cat > "$F" <<'KT'
          package it.prencipe.studio

          import android.os.Bundle
          import android.view.View
          import androidx.activity.enableEdgeToEdge
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              enableEdgeToEdge()
              super.onCreate(savedInstanceState)
              val root = findViewById<View>(android.R.id.content)
              ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                val b = insets.getInsets(
                  WindowInsetsCompat.Type.systemBars() or
                  WindowInsetsCompat.Type.displayCutout() or
                  WindowInsetsCompat.Type.ime())
                v.setPadding(b.left, b.top, b.right, b.bottom)
                WindowInsetsCompat.CONSUMED
              }
            }
          }
          KT
      - run: bash ci/run.sh android-build npx --yes @tauri-apps/cli@2 android build --apk --target aarch64
      - name: Firma dell'apk
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          UNS=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          echo "APK non firmato: $UNS"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNS" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-pass env:KS_PW --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PW --out dist-apk/Studio.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs dist-apk/Studio.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: studio-android
          path: dist-apk/Studio.apk

  release:
    needs: [windows, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.exe
            out/**/*.msi
            out/**/*.apk
