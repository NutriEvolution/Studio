<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<link rel="stylesheet" href="app.css"></head><body><div id=app></div><div id=sb></div>
<script src="icons.js"></script><script src="maps.js"></script><script src="import.js"></script><script src="ai.js"></script><script src="design.js"></script>
<script>
const $=s=>document.querySelector(s),DAY=864e5,today=()=>Math.floor(Date.now()/DAY),IV=[1,2,4,8,16];
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S=JSON.parse(localStorage.getItem('studio.v2')||'null')||{docs:[{id:1,title:'Diabete di tipo 2 (testo di esempio)',paras:[
"Il diabete mellito di tipo 2 è caratterizzato da insulino-resistenza e da ridotta secrezione insulinica. Nel tempo porta a iperglicemia cronica. La diagnosi si basa su glicemia a digiuno, curva da carico ed emoglobina glicata.",
"La terapia nutrizionale è un pilastro del trattamento. Il calo ponderale migliora il controllo glicemico. L'apporto di carboidrati va distribuito nell'arco della giornata.",
"Le fibre alimentari rallentano l'assorbimento del glucosio. Si raccomandano almeno 14 g ogni 1000 kcal."],kw:[],q:[],n:[],s:[]}],decks:[],view:'lib',cur:1,focus:false,gran:'frase',i:0,vm:0,panel:null,menu:null,modal:null,draft:null,rev:null,lay:'grid',ord:'ins',find:''};
const save=()=>localStorage.setItem('studio.v2',JSON.stringify(S)),doc=()=>S.docs.find(d=>d.id==S.cur),dk=id=>S.decks.find(d=>d.id==id);
const sents=d=>d.kind=='pdf'&&PS[d.id]?(S.gran=='riga'&&!S.pdfText&&PL[d.id]?PL[d.id]:PS[d.id]):d.paras.flatMap((p,pi)=>split(p).map(t=>({t,pi})));
const cards=k=>S.docs.filter(d=>k.src.includes(d.id)).flatMap(d=>d.q),due=k=>cards(k).filter(q=>q.due<=today());
const lt=async(b,c)=>window.__TAURI__?window.__TAURI__.core.invoke('leitner_preview',{boxN:b,correct:c}):(n=>[n,IV[n-1]])(c?Math.min(b+1,5):1);
const hl=(h,d)=>d.kw.reduce((a,k)=>a.replace(new RegExp('('+esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'),h);
let lastSel='',selT=0;document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(()=>{const s=getSelection(),t=s.toString().trim(),sb=$('#sb');
 if(t&&s.rangeCount&&s.anchorNode?.parentElement?.closest('.pg,.textLayer')){lastSel=t;const r=s.getRangeAt(0).getBoundingClientRect();sb.style.display='flex';const h=sb.offsetHeight,W=sb.offsetWidth;let y=r.bottom+(MOB()?36:10);if(y+h>innerHeight-70)y=Math.max(60,r.top-(MOB()?100:h+10));sb.style.top=y+'px';sb.style.left=Math.max(8,Math.min(innerWidth-W-8,r.left))+'px'}else sb.style.display='none'},MOB()?280:30)});
async function A(n,x){const d=S.docs.find(d=>d.id==S.cur);
 if(n=='view'){S.view=x;S.menu=null;S.rev=null;S.panel=null}
 if(n=='menu')S.menu=S.menu==x?null:x;
 if(n=='close'){S.menu=null;S.modal=null;S.edk=null}
 if(n=='open'){S.cur=x;S.view='read';S.i=S.docs.find(o=>o.id==x)?.pos||0;PV.sc=1;S.menu=null;S.pdfText=false;await loadDoc(x)}
 if(n=='focus')S.focus=!S.focus;if(n=='pt'){S.pdfText=!S.pdfText;S.area=null}
 if(n=='side'){S.side=S.side==x?null:x;S.menu=null}
 if(n=='area'){S.area=S.area==x?null:x;S.panel=x}
 if(n=='rm'){const[t,k]=x;if(t=='kw')d.kw.splice(k,1);else{d[t]=d[t].filter(o=>o.id!=k);if(t=='maps')S.mp=null}}
 if(n=='ed'){const[t,k]=x;if(t=='kw'){const r=await form('Modifica parola chiave',[{l:'Parola chiave',v:d.kw[k]}]);if(r&&r[0].trim())d.kw[k]=r[0].trim()}else{const o=d[t].find(o=>o.id==k);if(t=='q'){const r=await form('Modifica domanda',[{l:'Domanda',v:o.q,rows:3},{l:'Risposta',v:o.a,rows:4}]);if(r){o.q=r[0];o.a=r[1]}}else{const r=await form(t=='n'?'Modifica nota':'Modifica riassunto',[{l:'Testo',v:o.x,rows:6}]);if(r)o.x=r[0]}}}
 if(n=='rmdoc'&&await sure('Eliminare questo documento con note, domande e mappe?')){S.docs=S.docs.filter(o=>o.id!=x);S.decks.forEach(k=>k.src=k.src.filter(i=>i!=x))}
 if(n=='rndoc'){S.modal='edoc';S.edoc=x}if(n=='gran'){const o=sents(d)[S.i];S.gran=x;S.focus=true;S.menu=null;const L2=sents(d);if(o&&o.pg!=null){const k=L2.findIndex(z=>z.pg==o.pg&&z.e>o.s);if(k>=0)S.i=k}else S.i=Math.min(S.i,L2.length-1)}
 if(n=='vm')S.vm=x;
 if(n=='panel'){S.panel=S.panel==x?null:x}
 if(n=='go'){PV.sc=1;const L=sents(d),p=L[S.i].pi;if(S.gran!='par')S.i=Math.max(0,Math.min(L.length-1,S.i+x));else{const t=Math.max(0,Math.min(d.paras.length-1,p+x));S.i=L.findIndex(s=>s.pi==t)}}
 if(n=='lay'){S.lay=x;S.menu=null}if(n=='ord'){S.ord=x;S.menu=null}
 if(n=='saveedoc'){const o=S.docs.find(o=>o.id==S.edoc);if(o){o.title=$('#ft').value.trim()||o.title;o.year=$('#fy').value.trim();o.authors=$('#fa').value.split(',').map(x=>x.trim()).filter(Boolean)}S.modal=null;S.edoc=null}
 if(n=='editdk'){S.edk=x;S.modal='deck';S.menu=null}
 if(n=='modal'){S.modal=x;S.err=null;S.menu=null}
 if(n=='kw'){if(lastSel&&!d.kw.includes(lastSel))d.kw.push(lastSel);lastSel='';S.panel='kw'}
 if(n=='draft'){S.draft={t:x,x:lastSel||sents(d)[S.i].t.trim()};lastSel='';S.panel=x;S.menu=null;if(x=='s')S.draft.x=d.paras[sents(d)[S.i].pi]}
 if(n=='save'){const a=$('#d1').value.trim(),b=$('#d2')?.value.trim(),t=S.draft.t,id=Date.now();
  if(a){if(t=='q')d.q.push({id,q:a,a:b,box:1,due:today(),i:S.i});if(t=='n')d.n.push({id,x:a,i:S.i});if(t=='s')d.s.push({id,x:a,i:S.i})}S.draft=null}
 if(n=='cancel')S.draft=null;
 if(n=='addtext'){const t=$('#nt').value.trim(),x=$('#nx').value.trim();if(x)S.docs.push({id:Date.now(),title:t||'Senza titolo',paras:x.split(/\n+/).filter(Boolean),kw:[],q:[],n:[],s:[]});S.modal=null}
 if(n=='mkdeck'){const nm=$('#dn').value.trim(),o={name:nm,desc:$('#dd').value,src:[...document.querySelectorAll('.src:checked')].map(e=>+e.value)};if(nm){if(S.edk)Object.assign(dk(S.edk),o);else S.decks.push({id:Date.now(),...o})}S.modal=null;S.edk=null}
 if(n=='ren'){const v=await form('Rinomina mazzo',[{l:'Nome',v:dk(x).name}]);if(v&&v[0].trim())dk(x).name=v[0].trim();S.menu=null}
 if(n=='del'){if(await sure('Eliminare il mazzo?'))S.decks=S.decks.filter(k=>k.id!=x);S.menu=null}
 if(n=='study'){const[id,m]=x,k=dk(id),Q=m=='due'?due(k):cards(k);S.menu=null;if(Q.length)S.rev={id,m,q:Q.map(c=>c.id),k:0,show:false}}
 if(n=='show')S.rev.show=true;
 if(n=='studyall'){const Q=allQ().filter(q=>q.due<=today());if(Q.length)S.rev={id:null,m:'due',q:Q.map(c=>c.id),k:0,show:false}}
 if(n=='ans'){const c=allQ().find(c=>c.id==S.rev.q[S.rev.k]);if(S.rev.m!='test'){const[b,g]=await lt(c.box,x);c.box=b;c.due=today()+g}S.rev.k++;S.rev.show=false;if(S.rev.k>=S.rev.q.length)S.rev.end=true}
 save();render()}
const tip=(l,f)=>`<div onclick="${f}">${l}</div>`,mn=(pos,h)=>`<div class=ov onclick="A('close')"></div><div class=menu style="${pos}">${h}</div>`;
function topbar(){const lib=S.view!='read';
 if(lib)return`<div class=top><button onclick="A('menu','dots')">${I('ellipsis-vertical')}</button><div class=sp></div>${S.view=='lib'?`<button onclick="A('menu','plus')">${I('plus')}${I('chevron-down')}</button>`:`<button onclick="A('modal','deck')">${I('plus')}</button>`}<div class=sp></div>${S.view=='lib'?`<input style="width:150px;margin:0" placeholder="🔍 Cerca" value="${esc(S.find)}" oninput="S.find=this.value;render()">`:''}</div>`;
 return readTop()}
function menus(){const m=S.menu;if(!m)return'';if(m=='side')return sideMenu();if(m=='mexp')return mexpMenu();
 if(m=='plus'&&S.view=='lib')return mn('top:56px;left:50%;transform:translateX(-50%)',`<div class=h>AGGIUNGI FONTE</div>${tip(I('file-text')+' File PDF o TXT',"A('modal','file')")}${tip(I('file-plus')+' Testo (incolla)',"A('modal','text')")}<div class=mut style="padding:6px 12px">Audio, video e pagine web: prossimamente</div>`);
 if(m=='plus')return mn('top:56px;left:50%;transform:translateX(-50%)',`<div class=h>CREA</div>${tip('Nota',"A('draft','n')")}${tip('Domanda',"A('draft','q')")}${tip('Riassunto',"A('draft','s')")}<div class=h>SEZIONE INDICE</div>${['Capitolo','Paragrafo','Sottoparagrafo 1','Sottoparagrafo 2'].map((t,i)=>tip(t,`idxAdd(${i+1})`)).join('')}${tip('Mappa',"mapNew()")}`);
 if(m=='gran')return mn('top:56px;left:40%',`<div class=h>GRANULARITÀ FOCUS</div>${tip((S.gran=='frase'?'✓ ':'')+'Per frase',"A('gran','frase')")}${tip((S.gran=='par'?'✓ ':'')+'Per paragrafo',"A('gran','par')")}${doc().kind=='pdf'&&!S.pdfText?tip((S.gran=='riga'?'✓ ':'')+'Per riga',"A('gran','riga')"):''}`);
 if(m=='dots')return dotsMenu();
 if(String(m).startsWith('dk')){const id=+m.slice(2);return mn('top:150px;left:50%;transform:translateX(-50%)',`<div class=h>STUDIA</div>${tip('Ripassa le scadute ('+due(dk(id)).length+')',`A('study',[${id},'due'])`)}${tip('Ripassa tutto il mazzo',`A('study',[${id},'all'])`)}${tip('Mettiti alla prova (non salva)',`A('study',[${id},'test'])`)}${tip('Modifica mazzo…',`A('editdk',${id})`)}${tip('Rinomina',`A('ren',${id})`)}<div class=x onclick="A('del',${id})">Elimina mazzo</div>`)}return''}
function modal(){return modal0()+dlgHTML()}function modal0(){const mx=modalX()||modalAI()||modalMisc();if(mx)return mx;if(S.modal=='text')return`<div class=ov onclick="A('close')"></div><div class=modal><h2>Aggiungi un testo</h2><input id=nt placeholder="Titolo"><textarea id=nx rows=8 placeholder="Incolla qui il testo"></textarea><button onclick="A('close')">Annulla</button> <button class=pri onclick="A('addtext')">Aggiungi</button></div>`;
 if(S.modal=='deck')return`<div class=ov onclick="A('close')"></div><div class=modal><h2>${S.edk?'Modifica mazzo':'Crea un mazzo di flashcard'}</h2><div class=lab>Nome del mazzo</div><input id=dn placeholder="Inserisci il nome del mazzo" value="${esc(S.edk?dk(S.edk).name:'')}"><div class=lab>Descrizione</div><textarea id=dd rows=2 placeholder="A cosa serve questo mazzo?">${esc(S.edk?dk(S.edk).desc||'':'')}</textarea><div class=lab>Fonti per il mazzo</div>${S.docs.filter(d=>d.q.length).map(d=>`<label class=item style="display:block"><input type=checkbox class=src value=${d.id} ${S.edk&&dk(S.edk).src.includes(d.id)?'checked':''} style="width:auto;margin:0 8px 0 0">${esc(d.title)} <span class=mut>(${d.q.length} domande)</span></label>`).join('')||'<div class=mut>Nessuna fonte ha domande da cui creare flashcard.</div>'}<button onclick="A('close')">Annulla</button> <button class=pri onclick="A('mkdeck')">${S.edk?'Salva':'Aggiungi'}</button></div>`;return''}
function panel(){const d=doc(),p=S.panel;if(!p)return'';if(p=='ai')return aiPanel(d);
 const T={kw:[I('key-round'),'Parole chiave','Le parole chiave sono i termini più importanti del testo. Seleziona una parola e tocca “Parola chiave”.'],q:[I('circle-help'),'Domande','Le domande guidano la lettura e diventano flashcard per il ripasso. Selezionando un testo puoi crearne una.'],n:[I('sticky-note'),'Note','Le note raccolgono le tue riflessioni sul testo, con parole tue.'],s:[I('align-left'),'Riassunti','Un riassunto è una sintesi rapida di una porzione del testo.'],img:[I('image'),'Immagini','Le immagini che raccogli dal testo compariranno qui (in arrivo con i PDF).'],fx:[I('sigma'),'Formule','Le formule raccolte dal testo compariranno qui (in arrivo con i PDF).'],map:[I('network'),'Mappe','Le mappe sono schemi visivi del testo (editor in arrivo al prossimo passo).'],ai:[I('sparkles'),'Tutor AI','Il tutor AI sarà disponibile quando collegheremo una chiave Gemini.']}[p];
 const L={kw:d.kw.map((k,i)=>`<div class=item style="cursor:pointer" onclick="kwGo(${i})"><mark>${esc(k)}</mark>${acts('kw',i)}</div>`),q:d.q.map(q=>`<div class=item ${q.i!=null?`style="cursor:pointer" onclick="jumpTo(${q.i})"`:''}><b>${esc(q.q)}</b><div class=mut>${esc(q.a)} · scatola ${q.box}</div>${acts('q',q.id)}</div>`),n:d.n.map(q=>`<div class=item ${q.i!=null?`style="cursor:pointer" onclick="jumpTo(${q.i})"`:''}>${esc(q.x)}${acts('n',q.id)}</div>`),s:d.s.map(q=>`<div class=item ${q.i!=null?`style="cursor:pointer" onclick="jumpTo(${q.i})"`:''}>${esc(q.x)}${acts('s',q.id)}</div>`),map:mapList(d),img:imgList(d,'img'),fx:imgList(d,'fx')}[p]||[];
 const dr=S.draft?`<div class=item><div class=lab>${{q:'Nuova domanda',n:'Nuova nota',s:'Nuovo riassunto'}[S.draft.t]}</div><textarea id=d1 rows=3 placeholder="${S.draft.t=='q'?'Domanda':'Con parole tue'}">${S.draft.t=='q'?'':esc(S.draft.x)}</textarea>${S.draft.t=='q'?`<textarea id=d2 rows=3 placeholder="Risposta">${esc(S.draft.x)}</textarea>`:''}<button class=pri onclick="A('save')">Salva</button> <button onclick="A('cancel')">Annulla</button></div>`:'';
 return`<div class=side><div class=seg style="margin-bottom:8px"><button class=on>Contenuti</button><button onclick="A('panel','ai')">Tutor AI</button></div><h3>${T[1]}</h3>${dr}${L.join('')||(dr?'':`<div class=empty><div class=ic>${T[0]}</div><div class=mut>${T[2]}</div></div>`)}</div>`}
function render(){let h=topbar(),v=S.view;if(v=='lib'||v=='deck'){h=libDeckTop(v)+(v=='lib'?libView():deckView())+tabbar(v);$('#app').innerHTML=h+menus()+modal();fillImgs();fillCovers();return}
 if(v=='lib'){let D=S.docs.filter(d=>d.title.toLowerCase().includes(S.find.toLowerCase()));if(S.ord=='tit')D=[...D].sort((a,b)=>a.title.localeCompare(b.title));else D=[...D].reverse();
  h+=`<main>${D.length?`<div class="grid ${S.lay}">${D.map(d=>`<div class=card onclick="A('open',${d.id})"><div class=lab>${d.kind=='pdf'?'PDF':'Fonte'}<span class=acts><button onclick="event.stopPropagation();A('rndoc',${d.id})">${I('pencil')}</button><button onclick="event.stopPropagation();A('rmdoc',${d.id})">${I('trash-2')}</button></span></div><h3>${esc(d.title)}</h3><div class=mut>${esc((d.authors||[]).slice(0,2).join(', '))}${d.year?' · '+d.year:''}</div><div class=mut>${d.paras.length} paragrafi · ${d.kw.length} parole chiave · ${d.q.length} domande · ${d.n.length} note</div></div>`).join('')}</div>`:`<div class=empty><div class=ic>${I('library-big')}</div><h3>La libreria è vuota!</h3><div class=mut>Carica una fonte con il pulsante ＋ in alto.</div></div>`}</main>`}
 if(v=='deck'){const T=S.decks.reduce((a,k)=>a+due(k).length,0);
  h+=`<main>${S.rev?review():`<div class=grid><div class=card style="grid-column:1/-1"><span class="badge ${T?'d':''}" >OGGI</span><h2 style="font-size:1.8rem">${T?T+' flashcard da ripassare':'Nessuna flashcard da ripassare'}</h2><div class=mut>${T?'Apri un mazzo e scegli “Ripassa le scadute”.':'Torna quando una flashcard sarà in scadenza.'}</div></div>
  ${S.decks.map(k=>{const n=cards(k).length,dd=due(k).length;return`<div class=card><button style="position:absolute;right:10px;top:10px" onclick="A('menu','dk${k.id}')">${I('ellipsis-vertical')}</button><div class=big>${n}</div><div class="lab" style="text-align:center">${n?'carte':'mazzo senza domande'}</div><p><span class="badge ${dd?'d':''}">${dd?dd+' da ripassare':'✓ In pari'}</span></p><h3>${esc(k.name)}</h3><div class=mut>${k.src.length?k.src.length+' fonti':'nessuna fonte'}</div></div>`}).join('')}</div>${S.decks.length?'':`<div class=empty><div class=ic>${I('layers')}</div><h3>Non hai creato mazzi di flashcard!</h3><div class=mut>Crea un mazzo con il pulsante ＋ in alto.</div></div>`}`}</main>`}
 if(v=='read'){if(MOB()&&S.vm==1)S.vm=0;const d=doc(),L=sents(d);S.i=Math.max(0,Math.min(S.i,L.length-1));const cur=L[S.i];d.pos=S.i;d.prog=Math.max(d.prog||0,Math.round((S.i+1)/L.length*100));let t='',last=-1;(d.kind=='pdf'&&!S.pdfText?[]:L).forEach((s,k)=>{if(s.pi!=last){if(last>=0)t+='</p>';t+='<p>';last=s.pi}
   t+=`<span class="s${(S.gran=='par'?s.pi==cur.pi:k==S.i)?' on':''}" onclick="if(!getSelection().toString()){S.i=${k};render()}">${hl(esc(s.t),d)}</span>`});
  const R=[['ai',I('sparkles')],['img',I('image')],['fx',I('sigma')],['kw',I('key-round')],['q',I('circle-help')],['n',I('sticky-note')],['map',I('network')],['s',I('align-left')]];
  h+=`<main><div class=rd>${sideHTML(doc())}${S.vm==2?`${mapView()}`:`${pdfSlot(d)||`<div class="pg ${S.focus?'foc':''}" ondblclick="A('kw')">${t}</p></div>`}`}${S.vm==1?mapView():''}${panel()}<div class=rail>${R.map(([k,i])=>`<button class="${S.panel==k?'on':''}" onclick="A('panel','${k}')">${i}</button>`).join('')}</div></div>${readNav(d)}</main>`}
 if(v!='read')h+=`<div class=nav><button class="${v=='lib'?'on':''}" onclick="A('view','lib')">${I('library-big')} Libreria</button><button class="${v=='deck'?'on':''}" onclick="A('view','deck')">${I('layers')} Flashcard</button></div>`;
 if(PV.el&&PV.el.isConnected)PV.top=PV.el.scrollTop;$('#app').innerHTML=h+menus()+modal();bindMap();mountPdf();fillImgs();fillThumbs();document.getElementById('fq')?.focus();{const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}if(S.view=='read'&&PV.sc&&!(PV.el&&PV.el.isConnected)){PV.sc=0;document.querySelector('.s.on')?.scrollIntoView({block:'center',behavior:'smooth'})}}
function review(){const r=S.rev,k=dk(r.id);if(r.end)return`<div class="card empty"><h2>Ripasso completato</h2><div class=mut>${r.q.length} carte${r.m=='test'?' (nulla è stato salvato)':''}.</div><button class=pri onclick="A('view','deck')">Torna ai mazzi</button></div>`;
 const c=cards(k).find(c=>c.id==r.q[r.k]);return`<div class=mut>${esc(k.name)} · ${r.k+1}/${r.q.length}</div><div class="bx">${[1,2,3,4,5].map(b=>`<div><b>${cards(k).filter(q=>q.box==b).length}</b><div class=mut>Scatola ${b}</div></div>`).join('')}</div><div class="card qa">${esc(c.q)}${r.show?`<hr style="border-color:#ffffff22"><div style="color:var(--c)">${esc(c.a)}</div>`:''}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:12px">${r.show?`<button style="background:#7a2b2b" onclick="A('ans',false)">Sbagliata</button><button class=pri onclick="A('ans',true)">Giusta</button>`:`<button class=pri onclick="A('show')">Mostra risposta</button>`}</div>`}
document.addEventListener('keydown',e=>{if(S.view=='read'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key=='ArrowRight'||e.key==' ')A('go',1);if(e.key=='ArrowLeft')A('go',-1)}});
render();
</script></body></html>
